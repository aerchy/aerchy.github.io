<!--
  Jekyll Simple Search loader (customized)
  - shows a SHORT snippet centered on the match instead of the whole content
  - highlights the searched term
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
    </header>
    <p>{content}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    const escHtml = (s) =>
      s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      templateMiddleware: function(prop, value, template) {
        if (prop === 'categories') {
          return value === '' ? `${value}` : `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
        }

        if (prop === 'tags') {
          return value === '' ? `${value}` : `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
        }

        if (prop === 'url') {
          /* deep-link straight to the searched word using a Text Fragment, so
             clicking a result scrolls to (and highlights) that exact sentence */
          const input = document.getElementById('search-input');
          const q = (input && input.value ? input.value : '').trim();
          if (!q) return value;
          return value + '#:~:text=' + encodeURIComponent(q);
        }

        if (prop === 'content') {
          const input = document.getElementById('search-input');
          const q = (input && input.value ? input.value : '').trim();
          const text = (value || '').replace(/\s+/g, ' ').trim();
          if (!q) return escHtml(text.slice(0, 140));

          const idx = text.toLowerCase().indexOf(q.toLowerCase());
          if (idx === -1) return escHtml(text.slice(0, 140));

          const pad = 55;
          let start = Math.max(0, idx - pad);
          let end = Math.min(text.length, idx + q.length + pad);
          let snip = text.slice(start, end);
          if (start > 0) snip = snip.replace(/^\S*\s/, '');
          if (end < text.length) snip = snip.replace(/\s\S*$/, '');

          let safe = escHtml(snip);
          const re = new RegExp('(' + escRe(escHtml(q)) + ')', 'ig');
          safe = safe.replace(re, '<mark class="search-hl">$1</mark>');
          return (start > 0 ? '… ' : '') + safe + (end < text.length ? ' …' : '');
        }
      }
    });
  });
</script>
